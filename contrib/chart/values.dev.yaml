secretManager:
  backend: onepassword
  envPrefix: ""
  existingSecretName: centaur-infra-env

firewall:
  existingCaSecretName: centaur-firewall-ca
  existingCaKeySecretName: centaur-firewall-ca-key

postgres:
  auth:
    existingSecretName: centaur-infra-env
    existingSecretKey: POSTGRES_PASSWORD

slackbot:
  enabled: false
  image:
    pullPolicy: IfNotPresent

api:
  image:
    pullPolicy: IfNotPresent
  executionWorkerEnabled: true
  pluginWatcherEnabled: true
  egressDiscovery:
    enabled: false
  extraEnv:
    # Local kind has limited memory. Keep enough idle sandboxes for short
    # follow-ups, but let the API reconcile loop free capacity automatically.
    IDLE_TTL_S: "3600"
    MAX_ACTIVE_SANDBOX_SESSIONS: "8"
    ORPHAN_SANDBOX_TTL_S: "300"
  image:
    pullPolicy: IfNotPresent

ironProxy:
  image:
    pullPolicy: IfNotPresent
  manager:
    secretSource: onepassword

tokenBroker:
  enabled: true

sandbox:
  image:
    pullPolicy: IfNotPresent

codexTokenRotator:
  enabled: true
  image:
    pullPolicy: IfNotPresent

# Run the tool-server sidecar by default in dev so local clusters mirror
# production sandbox topology.
toolServer:
  enabled: true
