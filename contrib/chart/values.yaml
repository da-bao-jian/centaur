nameOverride: ""
fullnameOverride: ""

global:
  imagePullSecrets: []

secretManager:
  envPrefix: ""
  existingSecretName: centaur-infra-env

firewall:
  existingCaSecretName: centaur-firewall-ca
  existingCaKeySecretName: centaur-firewall-ca-key
  ca:
    certPem: ""
    keyPem: ""

ironProxy:
  image:
    repository: centaur-iron-proxy
    tag: latest
    pullPolicy: Always
  service:
    proxyPort: 8080
    managementPort: 9092
    healthPort: 9090
    # Postgres listener ports. iron-proxy allocates one listener per pg_dsn
    # secret, starting at pgPortRangeStart and incrementing. NetworkPolicies
    # allow the whole range so callers can reach any listener.
    pgPortRangeStart: 5432
    pgPortRangeEnd: 5471
  secretSource: onepassword
  secretTtl: 10m

# Values for the upstream 1Password Connect subchart
# (https://github.com/1Password/connect-helm-charts/tree/main/charts/connect).
# Deployment is gated on onepasswordConnect.connect.create AND on
# ironProxy.secretSource == "onepassword-connect"; just up sets both when
# OP_CONNECT_CREDENTIALS_FILE is present. The credentials Secret itself is
# created externally by contrib/scripts/bootstrap-k8s-secrets.sh.
onepasswordConnect:
  connect:
    create: false
    credentialsName: centaur-onepassword-connect-credentials
    credentialsKey: 1password-credentials.json

secrets:
  bootstrapSecretName: ""

api:
  replicaCount: 1
  image:
    repository: centaur-api
    tag: latest
    pullPolicy: Always
  executionWorkerEnabled: false
  defaultHarness: codex
  workflowWorkerEnabled: true
  warmPoolEnabled: false
  pluginWatcherEnabled: false
  slackEtlEnabled: false
  slackSyncIntervalSeconds: 3600
  slackBackfillIntervalSeconds: 3600
  slackBackfillChannelBatchLimit: 20
  slackSyncBackfillLookbackDays: 30
  slackSyncThreadLookbackDays: 3
  companyContextDocumentsIntervalSeconds: 14400
  slackEtlExcludedChannelPatterns: ""
  victoriaMetricsPushEnabled: false
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    failureThreshold: 6
    periodSeconds: 10
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 6
    periodSeconds: 10
    timeoutSeconds: 5
  egressDiscovery:
    enabled: true
    namespace: centaur-egress
    clusterDomain: cluster.local
    tailnetFqdnAnnotation: tailscale.com/tailnet-fqdn
  terminationGracePeriodSeconds: 35
  extraEnv: {}
  resources: {}

observability:
  # Optional single-node observability stack for local/staging deployments.
  # The API already exposes /metrics and structured JSON stdout logs; enabling
  # this stack stores metrics in VictoriaMetrics, stores Kubernetes stdout logs
  # in VictoriaLogs, and provisions Grafana datasources/dashboards.
  enabled: false
  environment: ""
  victoriaMetrics:
    enabled: true
    serviceName: victoriametrics
    replicaCount: 1
    image:
      repository: victoriametrics/victoria-metrics
      tag: v1.143.0
      pullPolicy: IfNotPresent
    retentionPeriod: 7d
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: ""
    resources: {}
  victoriaLogs:
    enabled: true
    serviceName: victorialogs
    replicaCount: 1
    image:
      repository: victoriametrics/victoria-logs
      tag: v1.49.0
      pullPolicy: IfNotPresent
    retentionPeriod: 7d
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: ""
    resources: {}
  grafana:
    enabled: true
    serviceName: grafana
    replicaCount: 1
    image:
      repository: grafana/grafana
      tag: 13.0.1
      pullPolicy: IfNotPresent
    admin:
      user: admin
      password: admin
      existingSecretName: ""
      existingSecretPasswordKey: admin-password
    anonymous:
      enabled: false
      orgRole: Admin
      hideLogin: true
    plugins:
      - victoriametrics-logs-datasource
    persistence:
      enabled: true
      size: 2Gi
      storageClassName: ""
    resources: {}
  otelCollector:
    enabled: true
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: 0.152.1
      pullPolicy: IfNotPresent
    logLevel: info
    resources: {}

overlay:
  mountPath: /app/overlay/org
  systemPrompt: ""
  defaultPersona: ""
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
    sourcePath: /overlay

sandbox:
  controller: pod
  image:
    repository: centaur-agent
    tag: latest
    pullPolicy: Always
  runtimeClassName: ""
  reposPath: ""
  extraEnv: {}
  stateVolume:
    enabled: false
    size: 10Gi
    storageClassName: ""
  resources:
    limits: {}
    requests:
      cpu: 100m
      memory: 512Mi

# Rotates Codex CLI's ChatGPT-plan OAuth tokens. The CronJob exchanges
# CODEX_REFRESH_TOKEN (stored in 1Password) at auth.openai.com, writes the
# rotated refresh_token back to 1Password, and patches the resulting
# access_token + id_token + account_id into centaur-infra-env. Sandboxes
# read those values via envFrom and pass them through to codex, with
# iron-proxy substituting the access_token on chatgpt.com requests.
codexTokenRotator:
  enabled: false
  # ChatGPT-plan access_tokens expire within hours, so we rotate hourly. The
  # earlier daily schedule led to silent codex timeouts once the cached token
  # aged out. 1Password writes at 24/day are well below any practical limit.
  schedule: "0 * * * *"
  clientId: "app_EMoamEEZ73f0CkXaXp7hrann"
  # 1Password vault that holds CODEX_REFRESH_TOKEN. Independent of the vault
  # iron-proxy reads other app secrets from.
  vault: ai-agents
  refreshTokenItem: CODEX_REFRESH_TOKEN
  # 1Password item updated each rotation with the fresh access_token. Iron-proxy
  # reads op://<vault>/<accessTokenItem>/credential to substitute the
  # Authorization header on chatgpt.com requests.
  accessTokenItem: CODEX_CHATGPT_ACCESS_TOKEN
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  backoffLimit: 2
  image:
    repository: centaur-codex-token-rotator
    tag: latest
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

repoCache:
  enabled: false
  hostPath: /var/lib/centaur/repos
  repositories: []
  syncIntervalSeconds: 300
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  githubToken:
    existingSecretName: ""
    secretKey: token
    token: ""
  egressPorts:
    - 443
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}

agentSandbox:
  enabled: false
  namespace:
    create: true
    name: agent-sandbox-system
  image:
    repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
    tag: v0.4.6
    pullPolicy: IfNotPresent
  controller:
    extensions: false

slackbot:
  enabled: true
  replicaCount: 1
  image:
    repository: centaur-slackbot
    tag: latest
    pullPolicy: Always
  runtimeErrorAlertChannel: ""
  extraEnv: {}
  resources: {}

postgres:
  enabled: true
  image:
    repository: paradedb/paradedb
    tag: 0.23.0-pg16
    pullPolicy: IfNotPresent
  args:
    - "-c"
    - "shared_preload_libraries=pg_search,pg_cron"
  auth:
    database: ai_v2
    username: tempo
    password: tempo_dev_change_me
    existingSecretName: centaur-infra-env
    existingSecretKey: POSTGRES_PASSWORD
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
    subPath: ""
  resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: centaur.local
  tls: []

httpRoutes: []

runnerAccess:
  enabled: false
  allowedCidrs: []
  apiService:
    type: LoadBalancer
    loadBalancerSourceRanges: []
  proxyService:
    type: LoadBalancer
    loadBalancerSourceRanges: []

networkPolicy:
  enabled: true
  ingressSourceNamespaces: []
  apiIngressSourceNamespaces: []
  ingressControllerNamespaces:
    - kube-system

podSecurityContext:
  fsGroupChangePolicy: OnRootMismatch

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
